name: Gate 1 learning smoke and reproducibility
on:
  push:
    paths:
      - 'gate1/**'
      - 'train_gate1.py'
      - 'tests/test_gate1.py'
      - '.github/workflows/gate1.yml'
  pull_request:
    paths:
      - 'gate1/**'
      - 'train_gate1.py'
      - 'tests/test_gate1.py'
      - '.github/workflows/gate1.yml'
  workflow_dispatch:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full Gate 0 and 1 unit tests
        run: python -m unittest discover -s tests -v
      - name: Differentiable training and held-out smoke
        env:
          OMP_NUM_THREADS: '1'
        run: python train_gate1.py --smoke --device cpu --out /tmp/nextlevel-gate1-smoke
