name: First-gate reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python run.py --trials 2 --facts 8 32 128 --out results/smoke.json
